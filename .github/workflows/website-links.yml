name: Website link checks

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '**/*.md'
      - 'sitemap.xml'
      - 'robots.txt'
      - '.github/workflows/website-links.yml'
  pull_request:
    paths:
      - '**/*.html'
      - '**/*.md'
      - 'sitemap.xml'
      - 'robots.txt'
      - '.github/workflows/website-links.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * 1'

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v5
      - name: Check links in the website and documentation
        uses: lycheeverse/lychee-action@v2
        with:
          # Patreon returns HTTP 403 to GitHub-hosted link checks.
          # Exclude only the two Patreon creator URL forms confirmed to return 403.
          args: >-
            --exclude '^https://www[.]patreon[.]com/(cw/)?RebelTortuga/?            --root-dir .
            --no-progress
            --max-retries 2
            --timeout 20
            './**/*.html'
            './**/*.md'
          fail: true
          jobSummary: true
      - name: Check live website availability
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          curl --fail --silent --show-error --location --retry 2 https://rebeltortuga.github.io/ -o /dev/null
          curl --fail --silent --show-error --location --retry 2 https://rebeltortuga.github.io/sitemap.xml -o /dev/null

