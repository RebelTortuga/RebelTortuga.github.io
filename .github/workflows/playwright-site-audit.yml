name: Playwright Website Audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'assets/**'
      - 'sitemap.xml'
      - 'favicon.svg'
      - 'scripts/site-audit.cjs'
      - 'scripts/accessibility-regression.cjs'
      - '.github/workflows/playwright-site-audit.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.html'
      - 'assets/**'
      - 'sitemap.xml'
      - 'favicon.svg'
      - 'scripts/site-audit.cjs'
      - 'scripts/accessibility-regression.cjs'
      - '.github/workflows/playwright-site-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Check local accessibility regressions
        timeout-minutes: 3
        run: node scripts/accessibility-regression.cjs
      - if: github.event_name != 'pull_request'
        run: node scripts/site-audit.cjs
      - if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: playwright-website-audit
          path: playwright-audit.md
          if-no-files-found: warn
